apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-discovery
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TeamDoubleO/infra-cd.git
    targetRevision: develop
    path: apps/02-discovery
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
