apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    arch: outer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server   
    spec:
      nodeSelector:
        app: keywe-service
      containers:
        - name: config-server
          image: sunwoo11/keywe_config_server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-password
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: git-username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: git-token

          resources:
            requests:
              memory: "256Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

---

apiVersion: v1
kind: Service
metadata:
  name: config-server
  labels:
    arch: outer
spec:
  selector:
    app: config-server
  ports:
    - name: http
      port: 8888
      targetPort: 8888

