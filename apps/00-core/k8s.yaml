apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        app: rabbitmq-service     # 노드에 이 label이 있어야 함
      tolerations:
        - key: "rabbitmq-only"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      priorityClassName: rabbitmq-priority
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: Always
          ports:
            - containerPort: 5672
            - containerPort: 15672
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi



---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      name: amqp
      targetPort: 5672
    - port: 15672
      name: management
      targetPort: 15672

---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    arch: outer
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app: rabbitmq

---

apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: rabbitmq-priority
value: 100000
globalDefault: false
description: "RabbitMQ는 클러스터에서 반드시 실행되어야 하는 핵심 메시지 브로커"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-mobile
  labels:
    arch: outer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-mobile
  template:
    metadata:
      labels:
        app: redis-mobile
    spec:
      nodeSelector:
        app: rabbitmq-service
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"


---

apiVersion: v1
kind: Service
metadata:
  name: redis-mobile
  labels:
    arch: outer
spec:
  selector:
    app: redis-mobile
  ports:
    - port: 6379
      targetPort: 6379


