apiVersion: apps/v1
kind: Deployment
metadata:
  name: entrance-gateway
  namespace: default
  labels:
    app: entrance-gateway
    arch: outer
spec:
  selector:
    matchLabels:
      app: entrance-gateway
  template:
    metadata:
      labels:
        app: entrance-gateway
    spec:
      nodeSelector:
        app: keywe-service
      containers:
        - name: entrance-gateway
          image: sunwoo11/keywe_entrance_gateway:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 60009
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_PROFILES_INCLUDE
              value: "actuator,swagger,security,redis,k8s-routes"
            - name: TZ
              value: Asia/Seoul
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: config-server-url

            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-password
            - name: JWT_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: jwt-access-token-secret

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-password

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: entrance-gateway-port

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 60009
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: entrance-gateway
  labels:
    app: entrance-gateway
    arch: outer
    istio: sidecar
spec:
  selector:
    app: entrance-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 60009
      name: http
  type: ClusterIP

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: entrance-gateway-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: entrance-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
