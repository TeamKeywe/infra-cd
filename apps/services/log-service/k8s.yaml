apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-service
  labels:
    arch: inner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-service
  template:
    metadata:
      labels:
        app: log-service
    spec:
      nodeSelector:
        app: keywe-service
      containers:
        - name: log-service
          image: sunwoo11/keywe_log_service:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 60010
            - containerPort: 50010
          env:
            - name: TZ
              value: Asia/Seoul
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_PROFILES_INCLUDE
              value: "actuator,swagger,redis,k8s-grpc,datasource"
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: config-server-url
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-password
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: db-host
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: db-port
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: db-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: db-pass
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: log-db-name
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: log-service-port
            - name: GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: log-grpc-port
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: log-service
  labels:
    arch: inner
    istio: sidecar
spec:
  selector:
    app: log-service
  ports:
    - port: 60010
      targetPort: 60010
      name: http
    - port: 50010
      targetPort: 50010
      name: grpc


