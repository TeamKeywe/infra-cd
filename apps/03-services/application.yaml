apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keywe-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TeamDoubleO/infra-cd.git
    targetRevision: develop
    path: apps/03-services/service-apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
